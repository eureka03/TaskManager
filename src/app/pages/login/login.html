<div class="LoginPage">
    
        <div class="loginForm">
            <h1>Sign In</h1>
            <input type="text" [(ngModel)]="username" placeholder="Username"/>
            <input type="password" placeholder="Password"/>
            <button>Login</button>
            <span class="sign-up">Dont have an account ? <a class="registration" href="#" >Sign Up</a></span>
            <span class="forgot">forgot your password?<a class="reset" href="#">Reset</a></span>
        </div>
        
</div>
